name: Publish macOS ARM64 agent

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable revision (e.g. 3.20.0-1); leave empty for build-only'
        type: string
        required: false
      source_ref:
        description: 'Source commit or tag; leave empty for the selected workflow ref'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || !endsWith(github.event.release.tag_name, '-latest')
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Validate release version and source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]] || { echo 'Expected a numbered revision, e.g. 3.20.0-1'; exit 1; }
            expected="${BASH_REMATCH[1]}"
            actual=$(awk '$1 == "go.woodpecker-ci.org/woodpecker/v3" { sub(/^v/, "", $2); print $2 }' go.mod)
            test "$expected" = "$actual" || { echo 'Release version does not match the pinned Woodpecker dependency'; exit 1; }
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native platform
        run: |
          test "$(uname -m)" = arm64
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
      - name: Check formatting
        run: test -z "$(gofmt -l backend cmd integration)"
      - name: Test
        run: make test
      - name: Vet integration code
        run: go vet -tags='integration test' ./...
      - name: Build and verify agent
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          make build
          ./bin/woodpecker-agent-apple --version
          file bin/woodpecker-agent-apple | grep 'Mach-O 64-bit executable arm64'
      - name: Package release
        run: |
          mkdir -p dist
          tar -czf dist/woodpecker-agent-apple-darwin-arm64.tar.gz -C bin woodpecker-agent-apple -C .. LICENSE README.md
          cd dist
          shasum -a 256 woodpecker-agent-apple-darwin-arm64.tar.gz > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: woodpecker-agent-apple-darwin-arm64
          path: dist/*
          if-no-files-found: error

  publish:
    if: needs.build.outputs.release_tag != ''
    needs: build
    concurrency:
      group: publish-versioned-agent-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Publishing logic comes from the workflow revision, even when building
          # a historical source ref for an older Woodpecker version line.
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: woodpecker-agent-apple-darwin-arm64
          path: dist
      - name: Test release publishing policy
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Publish immutable revision and refresh version alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: python3 .github/scripts/publish-release.py
